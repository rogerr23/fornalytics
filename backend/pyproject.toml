[project]
name = "fornalytics-backend"
version = "0.1.0"
description = "Fornalytics API: ingests product material and explains it through three lenses."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "ANN", # type hints everywhere
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
