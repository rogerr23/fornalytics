[project]
name = "fornalytics-backend"
version = "0.1.0"
description = "Fornalytics API: ingests product material and explains it through three lenses."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "alembic>=1.20.1",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "ANN", # type hints everywhere
]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Third-party warnings we cannot fix (google-genai docstrings, starlette's httpx2 notice).
filterwarnings = [
    "ignore:invalid escape sequence:SyntaxWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
